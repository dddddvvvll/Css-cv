<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Лучший пиклболл на Пхукете</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="container">
    <table class="table">
        <th>Место</th>
        <th width="50%">Изображение</th>
        <tr>
            <td>Kathu</td>
            <td><img src="https://images.squarespace-cdn.com/content/v1/674090e70ccf2536de2c3bd7/cf8c3264-5d13-43c1-95e5-7a419e39f732/Pickleball+Phuket.jpg"
                    width="100%" alt="Kathu Pickleball Club" class="photo"></td>
        </tr>
        <tr>
            <td>Coconut</td>
            <td><img src="coconut.jpg" width="100%" alt="Coconut" class="photo"></td>
        </tr>
        <tr>
            <td>Racoon</td>
            <td><img src="racoon.jpg" width="100%" alt="Racoon" class="photo"></td>
        </tr>
    </table>
    <div class="booking">

        <h2>Забронировать корт</h2>
        <form action="/">
            <div class="row">
                <div class="form-group">
                    <label for="name">Ваше имя:</label>
                    <input type="text" id="name" placeholder="Введите ваше имя">
                </div>
                        <div class="form-group">
                            <label for="email">Ваш email:</label>
                            <input type="email" id="email" placeholder="Введите ваш email">
                        </div>
                    </div>
                
                    <div class="form-group">
                        <label for="date">Выберите дату:</label>
                        <input type="date" id="date">
                    </div>

                    <br>
                    <div class="form-group">
                        <label for="time">Выберите время:</label>
                        <input type="time" id="time">
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="court">Выберите корт:</label>
                        <select id="court">
                            <option value="kathu">Kathu</option>
                            <option value="coconut">Coconut</option>
                            <option value="racoon">Racoon</option>
                        </select>
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="text">Ваши пожелания:</label>
                        <textarea id="text" placeholder="Введите ваши пожелания"></textarea>
                        <br>
                    </div>
                    <input class="btn" type="submit" value="Забронировать">


<div class="position">
    <div class="box">

    </div>
</div>
</div>
        </form>
    </div>
</body>

</html>
